              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 사용자에게 배정된 퀘스트를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 이미 완료된 퀘스트입니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
