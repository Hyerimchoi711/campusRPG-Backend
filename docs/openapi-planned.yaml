openapi: 3.0.3
info:
  title: Campus RPG API 예정 문서
  version: 0.1.0-draft
  description: |
    `docs/API_SPEC.md`를 기준으로 작성한 개발 예정 API용 OpenAPI 초안입니다.
    이 문서는 아직 구현되지 않았거나, 추가 설계가 필요한 엔드포인트를 정리합니다.

servers:
  - url: http://localhost:8888
    description: 백엔드 통합 API 서버

tags:
  - name: profile
    description: 프로필 및 한줄소개
  - name: home
    description: 홈 화면 및 펫/배경 정보
  - name: stats
    description: 스탯 및 피로도
  - name: schedules
    description: 일정 및 투두 관리
  - name: friends
    description: 친구 요청 및 목록 관리
  - name: inventory
    description: 인벤토리 아이템 사용

paths:
  /api/profile:
    get:
      tags: [profile]
      summary: 프로필 조회
      description: 닉네임, 대학, 나이, 학번, 학과와 함께 학년 또는 한줄소개 같은 확장 필드를 반환합니다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: 인증이 필요합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/profile/bio:
    post:
      tags: [profile]
      summary: 한줄소개 수정
      description: 사용자의 한줄소개를 수정합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BioUpdateRequest"
      responses:
        "200":
          description: 한줄소개 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileBioResponse"
        "400":
          description: 요청 본문이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증이 필요합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/home/theme:
    get:
      tags: [home]
      summary: 홈 화면 테마 조회
      description: 펫 이미지 또는 홈 배경 이미지 URL을 반환합니다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 홈 테마 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeThemeResponse"
        "401":
          description: 인증이 필요합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/stats:
    get:
      tags: [stats]
      summary: 스탯 조회
      description: 5종 스탯과 일일 피로도를 조회합니다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 스탯 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "401":
          description: 인증이 필요합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 스탯 정보를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/schedules:
    get:
      tags: [schedules]
      summary: 일정 목록 조회
      description: 날짜 또는 기간 조건으로 일정 목록을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          required: false
          description: 단일 날짜 조회용 ISO 날짜
          schema:
            type: string
            format: date
        - in: query
          name: from
          required: false
          description: 기간 조회 시작일
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: false
          description: 기간 조회 종료일
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 일정 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
        "400":
          description: 날짜 조건이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증이 필요합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [schedules]
      summary: 일정 추가
      description: 새로운 일정 또는 투두를 등록합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScheduleRequest"
      responses:
        "201":
          description: 일정 생성 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleResponse"
        "400":
          description: 요청 본문이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증이 필요합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/schedules/{id}/complete:
    post:
      tags: [schedules]
      summary: 일정 완료 처리
      description: 일정을 완료 상태로 바꾸고 경험치 보상을 반영합니다.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: 일정 ID
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 일정 완료 처리 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleCompleteResponse"
        "401":
          description: 인증이 필요합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 일정을 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/friends/request:
    post:
      tags: [friends]
      summary: 친구 요청 보내기
      description: 친구 코드를 이용해 다른 사용자에게 친구 요청을 보냅니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestCreateRequest"
      responses:
        "200":
          description: 친구 요청 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionMessageResponse"
        "400":
          description: 요청 본문이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증이 필요합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 친구 코드를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/friends/remove:
    post:
      tags: [friends]
      summary: 친구 삭제
      description: 친구 관계를 해제합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRemoveRequest"
      responses:
        "200":
          description: 친구 삭제 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionMessageResponse"
        "400":
          description: 요청 본문이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증이 필요합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/inventory/use:
    post:
      tags: [inventory]
      summary: 아이템 사용
      description: 인벤토리 아이템 수량을 줄이고 `effect_type`에 따른 효과를 반영합니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InventoryUseRequest"
      responses:
        "200":
          description: 아이템 사용 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryUseResponse"
        "400":
          description: 요청 본문이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증이 필요합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 아이템 또는 인벤토리 항목을 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: INVALID_REQUEST

    ProfileResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/ProfileUser"

    ProfileUser:
      type: object
      required:
        - id
        - nickname
        - studentId
        - major
        - universityName
        - age
      properties:
        id:
          type: integer
          example: 1
        nickname:
          type: string
          example: 캠퍼스용사
        studentId:
          type: string
          example: "20201234"
        major:
          type: string
          example: 컴퓨터공학과
        universityName:
          type: string
          example: 캠퍼스대학교
        age:
          type: integer
          example: 24
        grade:
          type: integer
          nullable: true
          example: 3
        bio:
          type: string
          nullable: true
          example: 오늘도 과제를 깨는 중

    BioUpdateRequest:
      type: object
      required: [bio]
      properties:
        bio:
          type: string
          maxLength: 200
          example: 오늘도 과제를 깨는 중

    ProfileBioResponse:
      type: object
      required: [ok, bio]
      properties:
        ok:
          type: boolean
          example: true
        bio:
          type: string
          example: 오늘도 과제를 깨는 중

    HomeThemeResponse:
      type: object
      required: [theme]
      properties:
        theme:
          type: object
          required: [backgroundImageUrl]
          properties:
            backgroundImageUrl:
              type: string
              example: /assets/home/backgrounds/default.png
            petImageUrl:
              type: string
              nullable: true
              example: /assets/pets/egg.png

    StatsResponse:
      type: object
      required:
        - health
        - social
        - diligence
        - focus
        - creativity
        - dailyFatigue
      properties:
        health:
          type: integer
          example: 10
        social:
          type: integer
          example: 8
        diligence:
          type: integer
          example: 14
        focus:
          type: integer
          example: 12
        creativity:
          type: integer
          example: 6
        dailyFatigue:
          type: integer
          example: 3
        lastUpdatedDate:
          type: string
          format: date
          example: 2026-04-13

    Schedule:
      type: object
      required: [id, title, scheduledDate, completed]
      properties:
        id:
          type: integer
          example: 101
        title:
          type: string
          example: 운영체제 과제 제출
        description:
          type: string
          nullable: true
          example: 23시 59분 전까지 업로드
        scheduledDate:
          type: string
          format: date
          example: 2026-04-14
        completed:
          type: boolean
          example: false
        expReward:
          type: integer
          example: 15

    CreateScheduleRequest:
      type: object
      required: [title, scheduledDate]
      properties:
        title:
          type: string
          example: 운영체제 과제 제출
        description:
          type: string
          nullable: true
          example: 23시 59분 전까지 업로드
        scheduledDate:
          type: string
          format: date
          example: 2026-04-14

    ScheduleResponse:
      type: object
      required: [schedule]
      properties:
        schedule:
          $ref: "#/components/schemas/Schedule"

    ScheduleCompleteResponse:
      type: object
      required: [ok, expGained, schedule]
      properties:
        ok:
          type: boolean
          example: true
        expGained:
          type: integer
          example: 15
        schedule:
          $ref: "#/components/schemas/Schedule"

    Friend:
      type: object
      required: [id, nickname]
      properties:
        id:
          type: integer
          example: 2
        nickname:
          type: string
          example: 팀플장인
        level:
          type: integer
          nullable: true
          example: 5
        evolutionStage:
          type: integer
          nullable: true
          example: 1
        universityName:
          type: string
          nullable: true
          example: 캠퍼스대학교
        grade:
          type: integer
          nullable: true
          example: 2
        bio:
          type: string
          nullable: true
          example: 시험기간엔 연락이 잘 안 돼요
        petImageUrl:
          type: string
          nullable: true
          example: /assets/pets/cat-stage1.png

    FriendRequest:
      type: object
      required: [id, fromUserId, nickname, friendCode]
      properties:
        id:
          type: integer
          example: 11
        fromUserId:
          type: integer
          example: 2
        nickname:
          type: string
          example: 팀플장인
        friendCode:
          type: string
          example: AB23CD
        requestedAt:
          type: string
          format: date-time
          example: 2026-04-13T09:00:00Z

    FriendRequestCreateRequest:
      type: object
      required: [friendCode]
      properties:
        friendCode:
          type: string
          example: AB23CD

    FriendRemoveRequest:
      type: object
      required: [friendUserId]
      properties:
        friendUserId:
          type: integer
          minimum: 1
          example: 2

    ActionMessageResponse:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
          example: true
        message:
          type: string
          example: 처리되었습니다

    InventoryUseRequest:
      type: object
      required: [itemId]
      properties:
        itemId:
          type: integer
          minimum: 1
          example: 3

    InventoryUseResponse:
      type: object
      required: [ok, remainingQuantity]
      properties:
        ok:
          type: boolean
          example: true
        remainingQuantity:
          type: integer
          example: 1
        appliedEffect:
          type: object
          nullable: true
          properties:
            effectType:
              type: string
              example: focus
            amount:
              type: integer
              example: 5
