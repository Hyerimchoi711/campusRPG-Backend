components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        message:
          type: string
          description: 사람이 읽기 쉬운 부가 설명(선택)

    ErrorCodeResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: INVALID_BODY

    HealthOkResponse:
      type: object
      required: [ok, service, database, geminiQuestApi]
      properties:
        ok:
          type: boolean
