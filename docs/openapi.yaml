openapi: 3.0.3
info:
  title: Campus RPG API 문서
  version: 0.1.0
  description: |
    현재 백엔드에 구현된 API를 기준으로 작성한 OpenAPI 초안입니다.
    `backend/server.js`와 각 라우트 모듈의 실제 경로를 반영합니다.

servers:
  - url: http://localhost:5555
    description: 로컬 백엔드 서버

tags:
  - name: root
    description: 기본 서버 라우트
  - name: health
    description: 서비스 및 데이터베이스 상태 확인
  - name: auth
    description: 로그인 및 회원가입
  - name: me
    description: 로그인한 사용자 정보 조회
  - name: shop
    description: 상점 아이템 목록
  - name: wallet
    description: 사용자 코인 잔액
  - name: inventory
    description: 인벤토리 조회 및 구매

paths:
  /:
    get:
      tags: [root]
      summary: 루트 경로
      description: API 서버가 실행 중인지 확인하는 문자열을 반환합니다.
      responses:
        '200':
          description: 성공 메시지
          content:
            text/plain:
              schema:
                type: string
                example: Campus Life RPG API is running!

  /api/health:
    get:
      tags: [health]
      summary: 백엔드 상태 확인
      description: 메인 백엔드 서비스와 데이터베이스 연결 상태를 확인합니다.
      responses:
        '200':
          description: 백엔드와 데이터베이스가 정상 상태입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOkResponse'
        '503':
          description: 데이터베이스를 사용할 수 없습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthFailResponse'

  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: |
        `loginId` 또는 `email`과 `password`를 사용해 로그인합니다.
        식별자에 `@`가 포함되어 있으면 이메일로 처리하고, 아니면 `student_id`로 조회합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 로그인 식별자 또는 비밀번호가 누락되었습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 로그인 정보가 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/register:
    post:
      tags: [auth]
      summary: 회원가입
      description: 사용자를 생성하고 기본 펫과 스탯 데이터를 함께 초기화합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: 입력값 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이메일 또는 학번 중복, 혹은 친구 코드 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      tags: [me]
      summary: 내 정보 조회
      description: 인증된 사용자의 기본 프로필과 첫 번째 펫 정보를 반환합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 현재 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/items:
    get:
      tags: [shop]
      summary: 상점 아이템 목록 조회
      description: 아이템 ID 오름차순으로 상점 카탈로그를 반환합니다.
      responses:
        '200':
          description: 아이템 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '500':
          description: 아이템 목록 조회 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'

  /api/wallet:
    get:
      tags: [wallet]
      security:
        - bearerAuth: []
      summary: 사용자 코인 잔액 조회
      description: 인증된 사용자의 현재 코인 잔액을 반환합니다.
      responses:
        '200':
          description: 코인 잔액
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '400':
          description: 잘못된 사용자 ID입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '401':
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '403':
          description: 요청 사용자와 토큰 사용자가 일치하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '404':
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '500':
          description: 잔액 조회 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'

  /api/inventory:
    get:
      tags: [inventory]
      security:
        - bearerAuth: []
      summary: 사용자 인벤토리 조회
      description: 인증된 사용자의 인벤토리 목록을 반환합니다.
      responses:
        '200':
          description: 인벤토리 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'
        '400':
          description: 잘못된 사용자 ID입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '401':
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '403':
          description: 요청 사용자와 토큰 사용자가 일치하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '404':
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '500':
          description: 인벤토리 조회 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'

  /api/inventory/purchase:
    post:
      tags: [inventory]
      security:
        - bearerAuth: []
      summary: 아이템 구매
      description: |
        인증된 사용자 코인에서 아이템 가격을 차감하고 인벤토리에 아이템을 추가합니다.
        이 작업은 트랜잭션으로 처리됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '200':
          description: 구매 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: 요청 본문이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '401':
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '402':
          description: 코인이 부족합니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientFundsResponse'
        '403':
          description: 요청 사용자와 토큰 사용자가 일치하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '404':
          description: 아이템 또는 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '500':
          description: 구매 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ErrorCodeResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: INVALID_BODY

    HealthOkResponse:
      type: object
      required: [ok, service, database, geminiQuestApi]
      properties:
        ok:
          type: boolean
          example: true
        service:
          type: string
          example: campus-rpg-backend
        database:
          type: string
          example: up
        geminiQuestApi:
          type: string
          example: quest-api 상태는 http://localhost:8787/api/health 에서 확인할 수 있습니다

    HealthFailResponse:
      type: object
      required: [ok, service, database, error]
      properties:
        ok:
          type: boolean
          example: false
        service:
          type: string
          example: campus-rpg-backend
        database:
          type: string
          example: down
        error:
          type: string

    LoginRequest:
      type: object
      required: [password]
      properties:
        loginId:
          type: string
          description: 이메일 또는 학번
          example: 20201234
        email:
          type: string
          format: email
          description: 현재 구현에서 대체 입력으로 허용되는 이메일 필드
          example: student@example.com
        password:
          type: string
          format: password
          example: password123

    LoginUser:
      type: object
      required: [id, nickname, email]
      properties:
        id:
          type: integer
          example: 1
        nickname:
          type: string
          example: campusHero
        email:
          type: string
          format: email
          example: student@example.com

    LoginResponse:
      type: object
      required: [ok, token, user]
      properties:
        ok:
          type: boolean
          example: true
        token:
          type: string
          description: JWT 액세스 토큰
        user:
          $ref: '#/components/schemas/LoginUser'

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
        - student_id
        - major
        - university_name
        - age
      properties:
        email:
          type: string
          format: email
          example: student@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123
        nickname:
          type: string
          maxLength: 50
          example: campusHero
        student_id:
          type: string
          maxLength: 30
          example: '20201234'
        major:
          type: string
          maxLength: 80
          example: Computer Science
        university_name:
          type: string
          maxLength: 120
          example: Example University
        age:
          type: integer
          minimum: 1
          maximum: 120
          example: 24

    RegisterResponse:
      type: object
      required: [ok, userId, friendCode]
      properties:
        ok:
          type: boolean
          example: true
        userId:
          type: integer
          example: 1
        friendCode:
          type: string
          example: AB23CD

    MeUser:
      type: object
      required:
        - id
        - email
        - nickname
        - coin
        - exp
        - studentId
        - major
        - universityName
        - age
        - friendCode
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: student@example.com
        nickname:
          type: string
          example: campusHero
        coin:
          type: integer
          example: 150
        exp:
          type: integer
          example: 30
        studentId:
          type: string
          example: '20201234'
        major:
          type: string
          example: Computer Science
        universityName:
          type: string
          example: Example University
        age:
          type: integer
          example: 24
        friendCode:
          type: string
          example: AB23CD

    Pet:
      type: object
      required: [id, name, level, evolutionStage, animalType]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Pet
        level:
          type: integer
          example: 1
        evolutionStage:
          type: integer
          example: 0
        animalType:
          type: string
          example: egg
      nullable: true

    MeResponse:
      type: object
      required: [user, pet]
      properties:
        user:
          $ref: '#/components/schemas/MeUser'
        pet:
          $ref: '#/components/schemas/Pet'

    Item:
      type: object
      required: [id, name, description, price, imageUrl, iconEmoji, effectType]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Coffee
        description:
          type: string
          example: Restores focus for studying.
        price:
          type: integer
          example: 30
        imageUrl:
          type: string
          nullable: true
          example: /images/items/coffee.png
        iconEmoji:
          type: string
          nullable: true
          example: "\u2615"
        effectType:
          type: string
          nullable: true
          example: focus

    InventoryItem:
      type: object
      required: [itemId, quantity, name, description, price, imageUrl, iconEmoji, effectType]
      properties:
        itemId:
          type: integer
          example: 1
        quantity:
          type: integer
          example: 2
        name:
          type: string
          example: Coffee
        description:
          type: string
          example: Restores focus for studying.
        price:
          type: integer
          example: 30
        imageUrl:
          type: string
          nullable: true
          example: /images/items/coffee.png
        iconEmoji:
          type: string
          nullable: true
          example: "\u2615"
        effectType:
          type: string
          nullable: true
          example: focus

    WalletResponse:
      type: object
      required: [coin]
      properties:
        coin:
          type: integer
          example: 150

    PurchaseRequest:
      type: object
      required: [itemId]
      properties:
        itemId:
          type: integer
          minimum: 1
          example: 2

    PurchaseResponse:
      type: object
      required: [coin, inventory]
      properties:
        coin:
          type: integer
          example: 120
        inventory:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'

    InsufficientFundsResponse:
      type: object
      required: [error, coin]
      properties:
        error:
          type: string
          example: INSUFFICIENT_FUNDS
        coin:
          type: integer
          example: 10
