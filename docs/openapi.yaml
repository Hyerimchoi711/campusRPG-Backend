openapi: 3.0.3
info:
  title: Campus RPG API 문서
  version: 0.1.0
  description: |
    현재 백엔드에 구현된 API를 기준으로 작성한 OpenAPI 초안입니다.
    `backend/server.js`와 각 라우트 모듈의 실제 경로를 반영합니다.

servers:
  - url: http://localhost:8888
    description: 로컬 백엔드 서버

tags:
  - name: root
    description: 기본 서버 라우트
  - name: health
    description: 서비스 및 데이터베이스 상태 확인
  - name: auth
    description: 로그인, 회원가입 및 카카오 로그인
  - name: me
    description: 로그인한 사용자 정보 조회
  - name: profile
    description: 로그인한 사용자의 프로필 및 한줄소개
  - name: stats
    description: 사용자 스탯 및 피로도
  - name: announcements
    description: 공지사항 목록 및 상세 (인증 불필요)
  - name: events
    description: 이벤트 배너 목록 (인증 불필요)
  - name: shop
    description: 상점 아이템 목록
  - name: wallet
    description: 사용자 코인 잔액
  - name: inventory
    description: 인벤토리 조회 및 구매
  - name: schedules
    description: 일정 및 투두 관리
  - name: quests
    description: 일일/주간 퀘스트 조회 및 완료 처리
  - name: quest-llm
    description: LLM 기반 맞춤 퀘스트 생성
  - name: friends
    description: 친구 목록 및 친구 요청 관리
  - name: users
    description: 사용자 공개 프로필 조회

paths:
  /:
    get:
      tags: [root]
      summary: 루트 경로
      description: API 서버가 실행 중인지 확인하는 문자열을 반환합니다.
      responses:
        "200":
          description: 성공 메시지
          content:
            text/plain:
              schema:
                type: string
                example: Campus Life RPG API is running!

  /api/health:
    get:
      tags: [health]
      summary: 백엔드 상태 확인
      description: 메인 백엔드 서비스와 데이터베이스 연결 상태를 확인합니다.
      responses:
        "200":
          description: 백엔드와 데이터베이스가 정상 상태입니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthOkResponse"
        "503":
          description: 데이터베이스를 사용할 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthFailResponse"

  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: |
        `loginId` 또는 `email`과 `password`를 사용해 로그인합니다.
        식별자에 `@`가 포함되어 있으면 이메일로 처리하고, 아니면 `student_id`로 조회합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: 로그인 식별자 또는 비밀번호가 누락되었습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 로그인 정보가 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/register:
    post:
      tags: [auth]
      summary: 회원가입
      description: 사용자를 생성하고 기본 펫과 스탯 데이터를 함께 초기화합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          description: 입력값 검증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 이메일 또는 학번 중복, 혹은 친구 코드 충돌
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/kakao/start:
    get:
      tags: [auth]
      summary: 카카오 로그인 시작 URL 조회
      description: |
        백엔드가 KAKAO_REST_API_KEY와 KAKAO_REDIRECT_URI로 카카오 authorize URL을 생성해 반환합니다.
        프론트엔드는 응답의 authUrl로 이동해 카카오 로그인을 시작합니다.
      responses:
        "200":
          description: 카카오 로그인 시작 URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KakaoStartResponse"
        "500":
          description: 카카오 로그인 환경 변수가 설정되지 않았습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/auth/kakao:
    post:
      tags: [auth]
      summary: 카카오 로그인
      description: |
        프론트엔드가 카카오 로그인 완료 후 redirect 페이지에서 추출한 인가 코드(code)를 전달합니다.
        백엔드는 인가 코드와 redirectUri로 카카오 토큰을 교환하고, 카카오 사용자 정보를 확인한 뒤 자체 JWT를 발급합니다.
        카카오 accessToken과 client_secret은 프론트엔드에 노출하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KakaoAuthRequest"
      responses:
        "200":
          description: 카카오 로그인 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KakaoAuthResponse"
        "400":
          description: 인가 코드 또는 redirectUri가 누락되었거나 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 카카오 인증 또는 사용자 정보 조회에 실패했습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 카카오 사용자 생성 중 중복된 정보가 있습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/me:
    get:
      tags: [me]
      summary: 내 정보 조회
      description: 인증된 사용자의 기본 프로필, **`user.stats`**(스탯·피로도), 첫 번째 펫 정보를 반환합니다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 현재 사용자 정보
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/me/quests/current:
    get:
      tags: [me]
      summary: 오늘·이번 주 퀘스트 롤 조회
      description: |
        KST 기준 `rollDate`의 일일 5슬롯·`weekId`(해당 주 월요일)의 주간 3슬롯을 서버에서 조합합니다.
        행이 없으면 지연 생성합니다. `questSource`는 `default`(풀 롤) 또는 LLM 전용 배정과 구분할 때 사용합니다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 일일 5 + 주간 3
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestCurrentResponse"
        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 조회 또는 롤 생성 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/me/quests/daily:
    patch:
      tags: [me]
      summary: 일일 퀘스트 슬롯 완료/해제
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestSlotPatchRequest"
      responses:
        "200":
          description: 갱신 성공. 첫 완료 시에만 rewards가 채워질 수 있습니다.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestSlotPatchResponse"
        "400":
          description: 잘못된 slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 슬롯 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/me/quests/weekly:
    patch:
      tags: [me]
      summary: 주간 퀘스트 슬롯 완료/해제
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestSlotPatchRequest"
      responses:
        "200":
          description: 갱신 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestSlotPatchResponse"
        "400":
          description: 잘못된 slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 슬롯 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/profile:
    get:
      tags: [profile]
      summary: 프로필 조회
      description: 로그인한 사용자의 닉네임, 학번, 학과, 대학, 나이, 학년, 한줄소개, 아바타 정보를 반환합니다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 프로필 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
        "401":
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/profile/bio:
    post:
      tags: [profile]
      summary: 한줄소개 수정
      description: 로그인한 사용자의 한줄소개를 수정합니다. 한줄소개는 최대 200자까지 입력할 수 있습니다.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BioUpdateRequest"
      responses:
        "200":
          description: 한줄소개 수정 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileBioResponse"
        "400":
          description: 요청 본문이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/stats:
    get:
      tags: [stats]
      summary: 스탯 조회
      description: 로그인한 사용자의 5종 스탯과 일일 피로도를 조회합니다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 스탯 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
        "401":
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 스탯 정보를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/announcements:
    get:
      tags: [announcements]
      summary: 공지 목록
      description: |
        최신순(`createdAt`) 공지 요약 목록을 반환합니다. 응답 키는 camelCase(`createdAt`)입니다.
      responses:
        "200":
          description: 공지 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnnouncementListItem"
        "500":
          description: 조회 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/announcements/{id}:
    get:
      tags: [announcements]
      summary: 공지 상세
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 공지 본문 포함
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementDetail"
        "400":
          description: 잘못된 ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 공지 없음
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 조회 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/events:
    get:
      tags: [events]
      summary: 이벤트 목록
      description: |
        최신순 이벤트 배너 목록. `imageUrl`, `linkUrl`, `createdAt`은 DB의 snake_case에서 camelCase로 매핑됩니다.
      responses:
        "200":
          description: 이벤트 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventListItem"
        "500":
          description: 조회 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/items:
    get:
      tags: [shop]
      summary: 상점 아이템 목록 조회
      description: 아이템 ID 오름차순으로 상점 카탈로그를 반환합니다.
      responses:
        "200":
          description: 아이템 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Item"
        "500":
          description: 아이템 목록 조회 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"

  /api/wallet:
    get:
      tags: [wallet]
      security:
        - bearerAuth: []
      summary: 사용자 코인 잔액 조회
      description: 인증된 사용자의 현재 코인 잔액을 반환합니다.
      responses:
        "200":
          description: 코인 잔액
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponse"
        "400":
          description: 잘못된 사용자 ID입니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
        "401":
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
        "403":
          description: 요청 사용자와 토큰 사용자가 일치하지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
        "404":
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
        "500":
          description: 잔액 조회 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"

  /api/inventory:
    get:
      tags: [inventory]
      security:
        - bearerAuth: []
      summary: 사용자 인벤토리 조회
      description: 인증된 사용자의 인벤토리 목록을 반환합니다.
      responses:
        "200":
          description: 인벤토리 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InventoryItem"
        "400":
          description: 잘못된 사용자 ID입니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
        "401":
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
        "403":
          description: 요청 사용자와 토큰 사용자가 일치하지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
        "404":
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
        "500":
          description: 인벤토리 조회 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"

  /api/inventory/purchase:
    post:
      tags: [inventory]
      security:
        - bearerAuth: []
      summary: 아이템 구매
      description: |
        인증된 사용자 코인에서 아이템 가격을 차감하고 인벤토리에 아이템을 추가합니다.
        요청 본문에 userId를 함께 보내면 토큰 사용자와 일치하는지 확인합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
