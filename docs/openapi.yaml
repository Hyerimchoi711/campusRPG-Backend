      summary: 맞춤 퀘스트 생성
      description: |
        인증된 사용자의 프로필과 요청 프롬프트를 바탕으로 Gemini가 맞춤 퀘스트를 생성합니다.
        생성된 퀘스트는 `quests`에 저장되고, `user_quests`를 통해 요청 사용자에게 배정됩니다.
