  /api/quests/{id}/complete:
    post:
      tags: [quests]
      security:
        - bearerAuth: []
      summary: 퀘스트 완료 처리 (레거시)
      description: |
        **레거시:** `user_quests` 배정 행을 완료하고 `reward_exp`·`reward_coin`·스탯·피로도를 반영합니다.
        슬롯 롤(`PATCH /api/me/quests/daily|weekly`)과는 별도입니다.
      parameters:
        - in: path
          name: id
          required: true
          description: 완료할 퀘스트 ID
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: 퀘스트 완료 처리 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestCompleteResponse"
        "400":
