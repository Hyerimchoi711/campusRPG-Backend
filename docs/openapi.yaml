      parameters:
        - in: query
          name: date
          required: false
          description: YYYY-MM-DD 형식의 단일 조회 날짜
          schema:
            type: string
            format: date
        - in: query
          name: from
          required: false
          description: YYYY-MM-DD 형식의 기간 시작일
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: false
          description: YYYY-MM-DD 형식의 기간 종료일
          schema:
            type: string
            format: date
      responses:
        "200":
          description: 일정 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Schedule"
        "400":
          description: 날짜 조회 조건이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Bearer 토큰이 없거나 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 일정 목록 조회 실패
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [schedules]
