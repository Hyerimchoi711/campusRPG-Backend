  /api/quests:
    get:
      tags: [quests]
      security:
        - bearerAuth: []
      summary: 퀘스트 목록 조회 (레거시)
      description: |
        **레거시:** `user_quests`에 배정된 퀘스트만 반환합니다. 일일 5·주간 3 **슬롯 롤**과는 무관합니다.
        신규 클라이언트는 `GET /api/me/quests/current`를 사용하세요.
      parameters:
        - in: query
          name: type
          required: false
          description: 조회할 퀘스트 유형입니다. 생략하면 DAILY로 조회합니다.
          schema:
            type: string
            enum: [DAILY, WEEKLY]
            default: DAILY
      responses:
        "200":
          description: 퀘스트 목록 조회 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quest"
        "400":
          description: 퀘스트 유형이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
