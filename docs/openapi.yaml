openapi: 3.0.3
info:
  title: Campus RPG API 문서
  version: 0.1.0
  description: |
    현재 백엔드에 구현된 API를 기준으로 작성한 OpenAPI 초안입니다.
    `backend/server.js`와 각 라우트 모듈의 실제 경로를 반영합니다.

servers:
  - url: http://localhost:8888
    description: 로컬 백엔드 서버

tags:
  - name: root
    description: 기본 서버 라우트
  - name: health
    description: 서비스 및 데이터베이스 상태 확인
  - name: auth
    description: 로그인, 회원가입 및 카카오 로그인
  - name: me
    description: 로그인한 사용자 정보 조회
  - name: shop
    description: 상점 아이템 목록
  - name: wallet
    description: 사용자 코인 잔액
  - name: inventory
    description: 인벤토리 조회 및 구매
  - name: friends
    description: 친구 목록 및 친구 요청 관리
  - name: users
    description: 사용자 공개 프로필 조회

paths:
  /:
    get:
      tags: [root]
      summary: 루트 경로
      description: API 서버가 실행 중인지 확인하는 문자열을 반환합니다.
      responses:
        '200':
          description: 성공 메시지
          content:
            text/plain:
              schema:
                type: string
                example: Campus Life RPG API is running!

  /api/health:
    get:
      tags: [health]
      summary: 백엔드 상태 확인
      description: 메인 백엔드 서비스와 데이터베이스 연결 상태를 확인합니다.
      responses:
        '200':
          description: 백엔드와 데이터베이스가 정상 상태입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthOkResponse'
        '503':
          description: 데이터베이스를 사용할 수 없습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthFailResponse'

  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: |
        `loginId` 또는 `email`과 `password`를 사용해 로그인합니다.
        식별자에 `@`가 포함되어 있으면 이메일로 처리하고, 아니면 `student_id`로 조회합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: 로그인 식별자 또는 비밀번호가 누락되었습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 로그인 정보가 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/register:
    post:
      tags: [auth]
      summary: 회원가입
      description: 사용자를 생성하고 기본 펫과 스탯 데이터를 함께 초기화합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400':
          description: 입력값 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이메일 또는 학번 중복, 혹은 친구 코드 충돌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/kakao/start:
    get:
      tags: [auth]
      summary: 카카오 로그인 시작 URL 조회
      description: |
        백엔드가 KAKAO_REST_API_KEY와 KAKAO_REDIRECT_URI로 카카오 authorize URL을 생성해 반환합니다.
        프론트엔드는 응답의 authUrl로 이동해 카카오 로그인을 시작합니다.
      responses:
        '200':
          description: 카카오 로그인 시작 URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaoStartResponse'
        '500':
          description: 카카오 로그인 환경 변수가 설정되지 않았습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/kakao:
    post:
      tags: [auth]
      summary: 카카오 로그인
      description: |
        프론트엔드가 카카오 로그인 완료 후 redirect 페이지에서 추출한 인가 코드(code)를 전달합니다.
        백엔드는 인가 코드와 redirectUri로 카카오 토큰을 교환하고, 카카오 사용자 정보를 확인한 뒤 자체 JWT를 발급합니다.
        카카오 accessToken과 client_secret은 프론트엔드에 노출하지 않습니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KakaoAuthRequest'
      responses:
        '200':
          description: 카카오 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KakaoAuthResponse'
        '400':
          description: 인가 코드 또는 redirectUri가 누락되었거나 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 카카오 인증 또는 사용자 정보 조회에 실패했습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 카카오 사용자 생성 중 중복된 정보가 있습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/me:
    get:
      tags: [me]
      summary: 내 정보 조회
      description: 인증된 사용자의 기본 프로필과 첫 번째 펫 정보를 반환합니다.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 현재 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/items:
    get:
      tags: [shop]
      summary: 상점 아이템 목록 조회
      description: 아이템 ID 오름차순으로 상점 카탈로그를 반환합니다.
      responses:
        '200':
          description: 아이템 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        '500':
          description: 아이템 목록 조회 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'

  /api/wallet:
    get:
      tags: [wallet]
      security:
        - bearerAuth: []
      summary: 사용자 코인 잔액 조회
      description: 인증된 사용자의 현재 코인 잔액을 반환합니다.
      responses:
        '200':
          description: 코인 잔액
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletResponse'
        '400':
          description: 잘못된 사용자 ID입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '401':
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '403':
          description: 요청 사용자와 토큰 사용자가 일치하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '404':
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '500':
          description: 잔액 조회 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'

  /api/inventory:
    get:
      tags: [inventory]
      security:
        - bearerAuth: []
      summary: 사용자 인벤토리 조회
      description: 인증된 사용자의 인벤토리 목록을 반환합니다.
      responses:
        '200':
          description: 인벤토리 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryItem'
        '400':
          description: 잘못된 사용자 ID입니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '401':
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '403':
          description: 요청 사용자와 토큰 사용자가 일치하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '404':
          description: 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '500':
          description: 인벤토리 조회 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'

  /api/inventory/purchase:
    post:
      tags: [inventory]
      security:
        - bearerAuth: []
      summary: 아이템 구매
      description: |
        인증된 사용자 코인에서 아이템 가격을 차감하고 인벤토리에 아이템을 추가합니다.
        이 작업은 트랜잭션으로 처리됩니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseRequest'
      responses:
        '200':
          description: 구매 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseResponse'
        '400':
          description: 요청 본문이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '401':
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
  /api/friends:
    get:
      tags: [friends]
      summary: 친구 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 친구 목록
          content:
            application/json:
              schema:
                type: object
                required: [friends]
                properties:
                  friends:
                    type: array
                    items:
                      $ref: '#/components/schemas/FriendItem'
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/friends/order:
    patch:
      tags: [friends]
      summary: 친구 정렬 순서 저장
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderedUserIds]
              properties:
                orderedUserIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: 저장 성공
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/friends/{friendUserId}:
    delete:
      tags: [friends]
      summary: 친구 삭제
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: friendUserId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 삭제 성공
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/friends/requests:
    post:
      tags: [friends]
      summary: 친구 코드로 친구 요청
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [friendCode]
              properties:
                friendCode:
                  type: string
      responses:
        '201':
          description: 요청 생성 성공
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 친구 코드 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 중복/이미 친구
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/friends/requests/incoming:
    get:
      tags: [friends]
      summary: 받은 친구 요청 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 받은 요청 목록
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/FriendRequestItem'

  /api/friends/requests/{id}/accept:
    post:
      tags: [friends]
      summary: 친구 요청 수락
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 수락 성공
        '404':
          description: 요청 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 이미 처리된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/friends/requests/{id}/reject:
    post:
      tags: [friends]
      summary: 친구 요청 거절
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 거절 성공
        '404':
          description: 요청 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/users/{userId}:
    get:
      tags: [users]
      summary: 공개 프로필 조회
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 조회 성공
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/PublicUser'
        '404':
          description: 사용자 없음
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'

        '402':
          description: 코인이 부족합니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InsufficientFundsResponse'
        '403':
          description: 요청 사용자와 토큰 사용자가 일치하지 않습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '404':
          description: 아이템 또는 사용자를 찾을 수 없습니다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'
        '500':
          description: 구매 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCodeResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    ErrorCodeResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: INVALID_BODY

    HealthOkResponse:
      type: object
      required: [ok, service, database, geminiQuestApi]
      properties:
        ok:
          type: boolean
          example: true
        service:
          type: string
          example: campus-rpg-backend
        database:
          type: string
          example: up
        geminiQuestApi:
          type: string
          example: quest-api 상태는 http://localhost:8787/api/health 에서 확인할 수 있습니다

    HealthFailResponse:
      type: object
      required: [ok, service, database, error]
      properties:
        ok:
          type: boolean
          example: false
        service:
          type: string
          example: campus-rpg-backend
        database:
          type: string
          example: down
        error:
          type: string

    LoginRequest:
      type: object
      required: [password]
      properties:
        loginId:
          type: string
          description: 이메일 또는 학번
          example: 20201234
        email:
          type: string
          format: email
          description: 현재 구현에서 대체 입력으로 허용되는 이메일 필드
          example: student@example.com
        password:
          type: string
          format: password
          example: password123

    LoginUser:
      type: object
      required: [id, nickname, email]
      properties:
        id:
          type: integer
          example: 1
        nickname:
          type: string
          example: campusHero
        email:
          type: string
          format: email
          example: student@example.com

    LoginResponse:
      type: object
      required: [ok, token, user]
      properties:
        ok:
          type: boolean
          example: true
        token:
          type: string
          description: JWT 액세스 토큰
        user:
          $ref: '#/components/schemas/LoginUser'

    KakaoStartResponse:
      type: object
      required: [authUrl]
      properties:
        authUrl:
          type: string
          format: uri
          description: 프론트엔드가 이동할 카카오 authorize URL
          example: https://kauth.kakao.com/oauth/authorize?client_id={KAKAO_REST_API_KEY}&redirect_uri=http%3A%2F%2Flocalhost%3A5173%2Fkakao&response_type=code

    KakaoAuthRequest:
      type: object
      required: [code, redirectUri]
      properties:
        code:
          type: string
          description: 카카오 redirect URL의 query string에서 추출한 인가 코드
          example: kakao-authorization-code
        redirectUri:
          type: string
          format: uri
          description: 카카오 개발자 콘솔에 등록된 프론트엔드 redirect URI
          example: http://localhost:5173/kakao

    KakaoAuthResponse:
      allOf:
        - $ref: '#/components/schemas/LoginResponse'

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - nickname
        - student_id
