      responses:
        "200":
          description: 구매 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseResponse"
        "400":
          description: 요청 본문이 올바르지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
        "401":
          description: Bearer 토큰이 없거나 유효하지 않습니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorCodeResponse"
        "402":
          description: 코인이 부족합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsufficientFundsResponse"
        "403":
          description: 요청 사용자와 토큰 사용자가 일치하지 않습니다
