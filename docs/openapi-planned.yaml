openapi: 3.0.3
info:
  title: Campus RPG API 예정 문서
  version: 0.1.0-draft
  description: |
    `docs/API_SPEC.md`를 기준으로 작성한 개발 예정 API용 OpenAPI 초안입니다.
    이 문서는 아직 구현되지 않았거나, 추가 설계가 필요한 엔드포인트를 정리합니다.

servers:
  - url: http://localhost:8888
    description: 백엔드 통합 API 서버

tags:
  - name: home
    description: 홈 화면 및 펫/배경 정보

paths:
  /api/home/theme:
    get:
      tags: [home]
      summary: 홈 화면 테마 조회
      description: 펫 이미지 또는 홈 배경 이미지 URL을 반환합니다.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 홈 테마 조회 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeThemeResponse"
        "401":
          description: 인증이 필요합니다
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: INVALID_REQUEST

    HomeThemeResponse:
      type: object
      required: [theme]
      properties:
        theme:
          type: object
          required: [backgroundImageUrl]
          properties:
            backgroundImageUrl:
              type: string
              example: /assets/home/backgrounds/default.png
            petImageUrl:
              type: string
              nullable: true
              example: /assets/pets/egg.png

